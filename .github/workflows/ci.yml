name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # 加引号避免 shell 展开 **，交给 Node 的 glob 处理，Windows/Linux 行为一致
        run: node --test "test/**/*.test.mjs"

      - name: Build (含 knowledge 快照校验)
        run: npm run build

  lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.17,<1"
          ruff check .

  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven test
        run: mvn -B test

  python:
    name: Python (knowledge + ai-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            knowledge/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 只装测试必需项：BGE / OCR / PDF 等可选依赖不装，避免 CI 拉 torch
          pip install -r ai-service/requirements.txt
          pip install "numpy>=1.26,<3"

      - name: Pytest
        env:
          KNOWLEDGE_SEED_REFERENCE: "0"
        run: python -m pytest tests/knowledge ai-service/app/tests -q
