global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: smartops-backend
    metrics_path: /actuator/prometheus
    # 批次一 #27：指标端点不再匿名，需携带内部令牌抓取
    # （凭据文件由部署侧挂载，内容等于后端 SMARTOPS_INTERNAL_TOKEN）。
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/smartops_internal_token
    static_configs:
      - targets: ['backend:8080']

  - job_name: smartops-ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-service:8001']

  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.yml']
