apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartops
  namespace: smartops
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - host: smartops.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080