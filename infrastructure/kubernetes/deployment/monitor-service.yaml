apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-service
  namespace: smartops
spec:
  replicas: 1
  selector:
    matchLabels: {app: monitor-service}
  template:
    metadata:
      labels: {app: monitor-service}
    spec:
      containers:
        - name: monitor-service
          image: smartops/monitor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef: {name: smartops-app-config}
            - secretRef: {name: smartops-secrets}
