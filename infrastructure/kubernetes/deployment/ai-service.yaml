apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: smartops
spec:
  replicas: 1
  selector:
    matchLabels: {app: ai-service}
  template:
    metadata:
      labels: {app: ai-service}
    spec:
      containers:
        - name: ai-service
          image: smartops/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: {name: smartops-app-config}
            - secretRef: {name: smartops-secrets}
          readinessProbe:
            httpGet: {path: /api/health, port: 8001}
            initialDelaySeconds: 10
            periodSeconds: 10