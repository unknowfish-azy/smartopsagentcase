apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smartops
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: smartops/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: smartops-app-config}
            - secretRef: {name: smartops-secrets}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 20