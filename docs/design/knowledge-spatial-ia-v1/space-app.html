<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识空间 · 737 条实装原型</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0E1116; --raised:#151A21; --overlay:#1B212A; --sunk:rgba(0,0,0,.32);
    --text:#e8f2f7; --muted:#92a6b5; --neutral:#8b949e;
    --border:rgba(159,190,207,.18); --hair:rgba(255,255,255,.06); --border-strong:rgba(159,190,207,.34);
    --focus:#7ad7f5; --danger:#f85149; --warning:#d29922; --success:#3fb950;
    --c1:#2496ed; --c2:#7ad7f5; --c3:#3fb950; --c4:#d29922; --c5:#f85149;
    --font:"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
    --r-sm:4px; --r-md:8px; --r-lg:12px; --t:150ms; --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}

  .bar{display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;border-bottom:1px solid var(--border);position:relative;z-index:20;background:var(--bg);white-space:nowrap}
  .brand b{font-size:14px;font-weight:500}
  .brand span{font:10.5px/1 var(--mono);letter-spacing:.12em;color:var(--neutral);margin-left:7px;text-transform:uppercase}
  .perf{font:11px var(--mono);color:var(--neutral);font-variant-numeric:tabular-nums;padding-left:4px}
  .perf b{color:var(--muted);font-weight:400}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;min-width:220px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--sunk);color:var(--muted)}
  .search input{width:100%;border:0;background:none;color:var(--text);font:12.5px var(--font);outline:none}
  .seg{display:inline-flex;padding:2px;border-radius:var(--r-md);background:rgba(232,242,247,.05);gap:2px}
  .seg button{height:24px;padding:0 9px;border-radius:var(--r-sm);color:var(--neutral);font-size:12px}
  .seg button[aria-pressed="true"]{background:var(--overlay);color:var(--text)}
  .pill{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-md);color:var(--muted);font-size:12px}
  .pill:hover{background:rgba(232,242,247,.05);color:var(--text)}

  .stage{position:relative;height:calc(100% - 54px);overflow:hidden;cursor:grab;background:radial-gradient(120% 90% at 50% 0%,#10161d,#0a0e13 60%,#070a0e)}
  .stage.dragging{cursor:grabbing}
  .world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

  .zone{position:absolute;border:1px solid var(--border);border-radius:var(--r-lg);background:rgba(18,23,30,.55);overflow:hidden}
  .zone:hover{border-color:var(--border-strong)}
  .zone svg{display:block;position:absolute;left:0;top:0;pointer-events:none}
  .zone-head{position:absolute;left:0;top:0;right:0;height:30px;cursor:pointer}

  .card{position:absolute;border-radius:5px;border:1px solid rgba(159,190,207,.14);background:var(--raised);
        overflow:hidden;text-align:left;transition:box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
  .card:hover{border-color:var(--border-strong);box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:6}
  .card.dim{opacity:.18}
  .card.hit{border-color:rgba(122,215,245,.6);box-shadow:0 0 0 1px rgba(122,215,245,.4)}
  .card .cbar{position:absolute;left:0;top:0;bottom:0;width:3px;height:auto;padding:0;border:0}
  .card .in{padding:8px 9px 7px 12px;height:100%;display:flex;flex-direction:column;gap:5px}
  .card .t{font-size:12.5px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .s{font-size:11px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .f{margin-top:auto;font:9.5px var(--mono);color:var(--neutral);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card[data-tier="micro"] .t,.card[data-tier="micro"] .s,.card[data-tier="micro"] .f{display:none}
  .card[data-tier="title"] .s,.card[data-tier="title"] .f{display:none}
  .card[data-tier="title"] .t{-webkit-line-clamp:2;font-size:11.5px}
  .card[data-tier="title"] .in{padding:5px 6px 4px 8px;gap:0}
  .card[data-tier="full"] .s{display:-webkit-box}
  .zone.bulk-off svg{opacity:0;transition:opacity 160ms linear}

  .labels{position:absolute;inset:0;pointer-events:none;z-index:12;overflow:hidden}
  .lbl{position:absolute;display:flex;align-items:center;gap:6px;transform:translate(-1px,-50%);padding:2px 6px;
       border-radius:var(--r-sm);background:rgba(9,13,18,.76);max-width:100%;overflow:hidden}
  .lbl i{width:3px;height:11px;border-radius:2px;flex:0 0 auto}
  .lbl b{font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lbl em{font:10px var(--mono);font-style:normal;color:var(--neutral);flex:0 0 auto}

  .minimap{position:absolute;right:14px;bottom:14px;width:150px;height:94px;border:1px solid var(--border);border-radius:var(--r-md);
           background:rgba(10,14,19,.94);z-index:15;overflow:hidden;cursor:crosshair}
  .minimap i{position:absolute;opacity:.55}
  .minimap .vp{position:absolute;border:1px solid var(--focus);background:rgba(122,215,245,.1);border-radius:2px}
  .hint{position:absolute;left:14px;bottom:14px;z-index:15;max-width:340px;padding:9px 11px;border:1px solid var(--border);
        border-radius:var(--r-md);background:rgba(10,14,19,.94);font-size:11px;color:var(--neutral);line-height:1.6}
  .hint b{color:var(--muted);font-weight:500}

  .side{position:absolute;right:0;top:0;bottom:0;width:392px;z-index:25;border-left:1px solid var(--border);
        background:var(--overlay);transform:translateX(100%);transition:transform 220ms var(--ease);display:flex;flex-direction:column}
  .side.open{transform:none}
  .side header{padding:16px 18px 12px;border-bottom:1px solid var(--hair)}
  .side h2{margin:8px 0;font-size:16.5px;font-weight:500;line-height:1.4}
  .side .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{font:9.5px var(--mono);letter-spacing:.04em;color:var(--neutral);border:1px solid var(--hair);border-radius:var(--r-sm);padding:3px 6px}
  .side .body{flex:1;overflow:auto;padding:14px 18px 28px;font-size:12.5px;color:var(--muted);line-height:1.7}
  .side h3{margin:14px 0 6px;font:10px/1 var(--mono);letter-spacing:.12em;color:var(--neutral);text-transform:uppercase}
  .side .rel{display:flex;flex-direction:column;gap:5px}
  .side .rel a{color:var(--muted);text-decoration:none;border-left:2px solid var(--border);padding-left:8px;font-size:12px}
  .side .rel a:hover{color:var(--text);border-color:var(--focus)}
  .close{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:var(--r-md);color:var(--neutral);font-size:15px}
  .close:hover{background:rgba(232,242,247,.07);color:var(--text)}

  .listview{position:absolute;inset:0;z-index:18;background:var(--bg);overflow:auto;padding:14px 16px 60px;display:none}
  .listview.on{display:block}
  .listview table{width:100%;border-collapse:collapse;font-size:12.5px}
  .listview th{position:sticky;top:0;background:var(--bg);text-align:left;font:10px var(--mono);letter-spacing:.1em;color:var(--neutral);
               text-transform:uppercase;padding:8px 9px;border-bottom:1px solid var(--border)}
  .listview td{padding:8px 9px;border-bottom:1px solid var(--hair);color:var(--muted)}
  .listview td:nth-child(2){color:var(--text)}
  @media (max-width:900px){ .brand span,.perf,.search{display:none} .side{width:100%} .hint{display:none} }
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><b>知识空间</b><span>SPATIAL IA · LIVE DATA</span></div>
  <div class="perf" id="perf"></div>
  <span class="grow"></span>
  <label class="search">
    <svg width="12" height="12" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5.5" cy="5.5" r="4"/><path d="M8.6 8.6 11.5 11.5"/></svg>
    <input id="q" placeholder="检索 737 条…" aria-label="检索知识条目">
  </label>
  <div class="seg" role="group" aria-label="视图">
    <button data-view="space" aria-pressed="true">空间</button>
    <button data-view="list" aria-pressed="false">列表</button>
  </div>
  <button class="pill" data-jump="overview">总览 0</button>
</div>

<div class="stage" id="stage">
  <div class="world" id="world">
    <div id="zones"></div>
    <div id="cards"></div>
  </div>
  <div class="labels" id="labels" aria-hidden="true"></div>
  <div class="minimap" id="minimap" role="button" tabindex="0" aria-label="迷你地图"></div>
  <div class="hint">
    <b>滚轮</b>缩放（以指针为锚点）· <b>拖拽</b>平移 · 点<b>域块</b>进分区 · <b>Esc</b> 逐级回退 · <b>0</b> 总览 · <b>/</b> 检索<br>
    数据来自 <b>knowledgeCatalog.js</b> 真实 737 条；L0 用 SVG 批量画块，L1/L2 只为视口内的卡挂 DOM。
  </div>
  <aside class="side" id="side" aria-live="polite">
    <button class="close" id="sideClose" aria-label="关闭">×</button>
    <header><div class="chips" id="sideChips"></div><h2 id="sideTitle"></h2></header>
    <div class="body" id="sideBody"></div>
  </aside>
  <div class="listview" id="listview"><table id="listTable"></table></div>
</div>

<script src="space-data.js"></script>
<script>
/* ============================================================ 数据 ============================================================ */
const KB = window.__KB__
if (!KB) { document.body.innerHTML = '<p style="padding:24px;color:#f85149">缺少 space-data.js：先运行 node build-data.mjs</p>' }

const DOM_COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)']
const WORLD_W = 3600, WORLD_H = 2100
const HEAD = 30, PAD = 10, GAP = 5
const K_MIN = 0.14, K_MAX = 2.4
const L1 = 0.30, L2 = 0.95        // LOD 阈值
const DOM_MIN_K = 0.42            // 低于此值不挂 DOM 卡片，只画 SVG 块

/* ============================================================ 布局：√n 面积 + 递归切块 ============================================================ */
function treemap (items, box, out, horiz) {
  if (items.length === 1) { out.push({ ...items[0], ...box }); return }
  const total = items.reduce((a, b) => a + b.w, 0)
  let acc = 0, cut = 1
  for (let i = 0; i < items.length - 1; i++) { acc += items[i].w; if (acc >= total / 2) { cut = i + 1; break } }
  const left = items.slice(0, cut), right = items.slice(cut)
  const ratio = left.reduce((a, b) => a + b.w, 0) / total
  if (horiz) {
    const wl = Math.round(box.w * ratio)
    treemap(left, { x: box.x, y: box.y, w: wl, h: box.h }, out, false)
    treemap(right, { x: box.x + wl, y: box.y, w: box.w - wl, h: box.h }, out, false)
  } else {
    const hl = Math.round(box.h * ratio)
    treemap(left, { x: box.x, y: box.y, w: box.w, h: hl }, out, true)
    treemap(right, { x: box.x, y: box.y + hl, w: box.w, h: box.h - hl }, out, true)
  }
}

function buildLayout () {
  const t0 = performance.now()
  const weight = KB.domains.map(d => Math.sqrt(d.n))
  const sum = weight.reduce((a, b) => a + b, 0)
  const items = KB.domains.map((d, i) => ({ d, w: weight[i] / sum * WORLD_W * WORLD_H })).sort((a, b) => b.w - a.w)
  const zones = []
  treemap(items, { x: 0, y: 0, w: WORLD_W, h: WORLD_H }, zones, true)

  zones.forEach((z, zi) => {
    z.color = DOM_COLORS[zi % DOM_COLORS.length]
    const n = z.d.n
    const innerW = z.w - PAD * 2, innerH = z.h - HEAD - PAD
    /* 选列数：让卡片既铺满域、又接近 1.5 的宽高比 */
    let best = { cols: 1, cw: innerW, ch: innerH, score: Infinity }
    for (let cols = 1; cols <= 20; cols++) {
      const rows = Math.ceil(n / cols)
      const cw = (innerW - GAP * (cols - 1)) / cols
      const ch = (innerH - GAP * (rows - 1)) / rows
      if (cw < 8 || ch < 8) continue
      const score = Math.abs(cw / ch - 1.5) + Math.abs((cols * rows - n) / n) * 1.5
      if (score < best.score) best = { cols, cw, ch, rows, score }
    }
    z.grid = { cols: best.cols, cw: Math.floor(best.cw), ch: Math.floor(best.ch), innerW, innerH }
    z.cards = []
  })

  const byZone = new Map(zones.map(z => [z.d.id, z]))
  for (const e of KB.entries) {
    const z = byZone.get(e.d)
    if (!z) continue
    const { cols, cw, ch } = z.grid
    const idx = z.cards.length
    const c = idx % cols, r = Math.floor(idx / cols)
    z.cards.push({
      ...e,
      x: z.x + PAD + c * (cw + GAP),
      y: z.y + HEAD + r * (ch + GAP),
      w: cw, h: ch, color: z.color, zone: z
    })
  }
  return { zones, ms: performance.now() - t0 }
}

const { zones, ms: layoutMs } = buildLayout()
const allCards = zones.flatMap(z => z.cards)
const cardById = new Map(allCards.map(c => [c.id, c]))

/* ============================================================ 相机 ============================================================ */
const stage = document.getElementById('stage')
const world = document.getElementById('world')
const cam = { k: 0.2, tx: 0, ty: 0 }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))

function lodOf (k) { return k < L1 ? 0 : k < L2 ? 1 : 2 }

let raf = 0
/* 帧时采样（最近 120 帧）：给性能数字一个可复现的来源 */
const ft = []
let lastFrame = 0
function sampleFrame (t) {
  if (lastFrame) { ft.push(t - lastFrame); if (ft.length > 120) ft.shift() }
  lastFrame = t
  requestAnimationFrame(sampleFrame)
}
requestAnimationFrame(sampleFrame)
function pct (arr, p) {
  if (!arr.length) return 0
  const s = arr.slice().sort((a, b) => a - b)
  return s[Math.min(s.length - 1, Math.floor(s.length * p))]
}

function applyCamera () {
  world.style.transform = `translate3d(${cam.tx}px,${cam.ty}px,0) scale(${cam.k})`
  const lod = lodOf(cam.k)
  world.dataset.lod = String(lod)
  renderLabels()
  renderMinimap()
  syncCards()
  renderPerf()
}

function schedule () { if (!raf) raf = requestAnimationFrame(() => { raf = 0; applyCamera() }) }

function fitOverview () {
  const w = stage.clientWidth, h = stage.clientHeight
  cam.k = Math.min(w / WORLD_W, h / WORLD_H) * 0.95
  cam.tx = (w - WORLD_W * cam.k) / 2
  cam.ty = (h - WORLD_H * cam.k) / 2
  applyCamera()
}

function zoomAt (mx, my, f) {
  const k2 = clamp(cam.k * f, K_MIN, K_MAX)
  cam.tx = mx - (mx - cam.tx) * (k2 / cam.k)
  cam.ty = my - (my - cam.ty) * (k2 / cam.k)
  cam.k = k2
  schedule()
}

function centerOn (wx, wy, k) {
  cam.k = clamp(k, K_MIN, K_MAX)
  cam.tx = stage.clientWidth / 2 - wx * cam.k
  cam.ty = stage.clientHeight / 2 - wy * cam.k
  applyCamera()
}

function flyToZone (z, k) {
  const target = k ?? clamp(Math.min(stage.clientWidth / z.w, stage.clientHeight / z.h) * 1.15, 0.6, 1.2)
  centerOn(z.x + z.w / 2, z.y + HEAD + z.grid.innerH / 2, target)
}

/* ============================================================ 渲染：域与批量块 ============================================================ */
function renderZones () {
  const host = document.getElementById('zones')
  host.innerHTML = zones.map(z => {
    const rects = z.cards.map(c => `<rect x="${c.x - z.x}" y="${c.y - z.y}" width="${c.w}" height="${c.h}"
        rx="${Math.min(3, c.w / 4)}" fill="${c.color}" fill-opacity="0.16" stroke="${c.color}" stroke-opacity="0.28" stroke-width="0.6"/>`).join('')
    return `<div class="zone" data-zone="${z.d.id}" style="left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px">
      <svg width="${z.w}" height="${z.h}" viewBox="0 0 ${z.w} ${z.h}" aria-hidden="true">${rects}</svg>
      <div class="zone-head" data-zone-head="${z.d.id}" title="进入 ${esc(z.d.label)}"></div>
    </div>`
  }).join('')
}

/* ============================================================ 渲染：虚拟化 DOM 卡片 ============================================================ */
const mounted = new Map()   // id -> element
let mountPeak = 0

function visibleCards () {
  if (cam.k < DOM_MIN_K) return []
  const vw = stage.clientWidth / cam.k, vh = stage.clientHeight / cam.k
  const margin = 120 / cam.k
  const x0 = -cam.tx / cam.k - margin, y0 = -cam.ty / cam.k - margin
  const x1 = x0 + vw + margin * 2, y1 = y0 + vh + margin * 2
  const out = []
  for (const z of zones) {
    if (z.x > x1 || z.x + z.w < x0 || z.y > y1 || z.y + z.h < y0) continue
    for (const c of z.cards) {
      if (c.x + c.w < x0 || c.x > x1 || c.y + c.h < y0 || c.y > y1) continue
      out.push(c)
      if (out.length >= 200) return out
    }
  }
  return out
}

function cardEl (c) {
  const el = document.createElement('button')
  el.className = 'card'
  el.dataset.card = c.id
  el.style.cssText = `left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px`
  el.setAttribute('aria-label', `${c.t}${c.ty ? '，' + c.ty : ''}`)
  el.innerHTML = `<span class="cbar" style="background:${c.color}"></span>
    <span class="in"><span class="t">${esc(c.t)}</span><span class="s">${esc(c.s || '')}</span>
    <span class="f">${esc(c.ty || '未分类')}</span></span>`
  return el
}

function syncCards () {
  const want = visibleCards()
  const wantIds = new Set(want.map(c => c.id))
  for (const [id, el] of mounted) if (!wantIds.has(id)) { el.remove(); mounted.delete(id) }
  const host = document.getElementById('cards')
  for (const c of want) {
    let el = mounted.get(c.id)
    if (!el) { el = cardEl(c); host.appendChild(el); mounted.set(c.id, el) }
    const wpx = c.w * cam.k, hpx = c.h * cam.k
    el.dataset.tier = (wpx >= 124 && hpx >= 80) ? 'full' : (wpx >= 44 && hpx >= 22) ? 'title' : 'micro'
  }
  /* 同一个域不要同时出现「批量块」和「真卡片」：有卡片的域关掉它的 SVG 层 */
  const perZone = new Map()
  for (const id of mounted.keys()) {
    const z = cardById.get(id)?.zone
    if (z) perZone.set(z.d.id, (perZone.get(z.d.id) || 0) + 1)
  }
  document.querySelectorAll('.zone').forEach(el => {
    el.classList.toggle('bulk-off', (perZone.get(el.dataset.zone) || 0) > 4)
  })
  if (mounted.size > mountPeak) mountPeak = mounted.size
  applyFilterClasses()
}

/* ============================================================ 标签 HUD ============================================================ */
function renderLabels () {
  const host = document.getElementById('labels')
  const parts = []
  for (const z of zones) {
    const x = z.x * cam.k + cam.tx, y = z.y * cam.k + cam.ty + (HEAD * cam.k) / 2
    const w = z.w * cam.k
    if (w < 96) continue
    if (y < 10 || y > stage.clientHeight - 10 || x + w < 0 || x > stage.clientWidth) continue
    parts.push(`<span class="lbl" style="left:${Math.max(2, x + 5)}px;top:${y}px;max-width:${Math.max(60, w - 14)}px">
      <i style="background:${z.color}"></i><b>${esc(z.d.label)}</b><em>${z.d.n}</em></span>`)
  }
  host.innerHTML = parts.join('')
}

/* ============================================================ 迷你地图 ============================================================ */
function renderMinimap () {
  const mm = document.getElementById('minimap')
  if (!mm.dataset.init) {
    mm.innerHTML = zones.map(z => `<i style="left:${z.x / WORLD_W * 100}%;top:${z.y / WORLD_H * 100}%;
      width:${z.w / WORLD_W * 100}%;height:${z.h / WORLD_H * 100}%;background:${z.color}"></i>`).join('') + '<div class="vp" id="vp"></div>'
    mm.dataset.init = '1'
  }
  const vp = document.getElementById('vp')
  if (!vp) return
  const vw = stage.clientWidth / cam.k, vh = stage.clientHeight / cam.k
  vp.style.left = clamp(-cam.tx / cam.k / WORLD_W * 100, 0, 100) + '%'
  vp.style.top = clamp(-cam.ty / cam.k / WORLD_H * 100, 0, 100) + '%'
  vp.style.width = clamp(vw / WORLD_W * 100, 1.5, 100) + '%'
  vp.style.height = clamp(vh / WORLD_H * 100, 1.5, 100) + '%'
}

/* ============================================================ 状态行（性能证据） ============================================================ */
function renderPerf () {
  const cz = zoneAtCenter()
  document.getElementById('perf').innerHTML =
    `<b>${KB.total}</b> 条 · <b>${KB.domains.length}</b> 域 · ${cz ? esc(cz.d.label) : '—'} · ` +
    `L${lodOf(cam.k)} ${Math.round(cam.k * 100)}% · SVG ${KB.total} · <b>DOM ${mounted.size}</b> · peak ${mountPeak} · layout ${layoutMs.toFixed(1)}ms · 帧 p50 ${pct(ft,0.5).toFixed(1)}ms p95 ${pct(ft,0.95).toFixed(1)}ms`
}

function zoneAtCenter () {
  const cx = (-cam.tx + stage.clientWidth / 2) / cam.k
  const cy = (-cam.ty + stage.clientHeight / 2) / cam.k
  return zones.find(z => cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h) || null
}

/* ============================================================ 侧栏 ============================================================ */
const side = document.getElementById('side')
let openedId = null
function openCard (c) {
  openedId = c.id
  document.getElementById('sideChips').innerHTML =
    `<span class="chip">${esc(c.ty || '未分类')}</span><span class="chip">${esc(c.p || '—')}</span>` +
    `<span class="chip">${esc(c.zone.d.label)}</span>` + (c.sv ? `<span class="chip">${esc(c.sv)}</span>` : '')
  document.getElementById('sideTitle').textContent = c.t
  const rel = allCards.filter(x => x.id !== c.id && (x.p === c.p || x.d === c.d)).slice(0, 8)
  document.getElementById('sideBody').innerHTML = `
    <h3>摘要</h3><p>${esc(c.s || '（此条目在 catalog 中没有摘要）')}</p>
    <h3>同域 / 同平台 · ${rel.length}</h3>
    <div class="rel">${rel.map(r => `<a href="#" data-card="${r.id}">${esc(r.t)}</a>`).join('')}</div>
    <h3>空间位置</h3><p>${esc(c.zone.d.label)} · 世界坐标 ${Math.round(c.x)}, ${Math.round(c.y)} · 卡片 ${Math.round(c.w)}×${Math.round(c.h)}</p>
    <h3>条目 id</h3><p style="font-family:var(--mono);font-size:11px;word-break:break-all">${esc(c.id)}</p>`
  side.classList.add('open')
}
function closeCard () { side.classList.remove('open'); openedId = null; applyFilterClasses() }

/* ============================================================ 检索 ============================================================ */
let term = ''
function applyFilterClasses () {
  if (!term) { document.querySelectorAll('.card').forEach(el => el.classList.remove('dim', 'hit')); return }
  document.querySelectorAll('.card').forEach(el => {
    const c = cardById.get(el.dataset.card)
    const hit = c && matches(c, term)
    el.classList.toggle('hit', Boolean(hit))
    el.classList.toggle('dim', !hit)
  })
}
const matches = (c, t) =>
  c.t.toLowerCase().includes(t) || (c.s || '').toLowerCase().includes(t) ||
  (c.ty || '').toLowerCase().includes(t) || (c.p || '').toLowerCase().includes(t)

function runFilter (value) {
  term = value.trim().toLowerCase()
  if (!term) { applyFilterClasses(); renderPerf(); return }
  const hits = allCards.filter(c => matches(c, term))
  if (hits.length) {
    const first = hits[0]
    centerOn(first.x + first.w / 2, first.y + first.h / 2, Math.max(cam.k, 1.05))
    openCard(first)
  }
  document.getElementById('perf').innerHTML += ` · 命中 <b>${hits.length}</b>`
}
document.getElementById('q').addEventListener('input', e => runFilter(e.target.value))

/* ============================================================ 交互 ============================================================ */
stage.addEventListener('wheel', e => {
  if (document.getElementById('listview').classList.contains('on')) return
  e.preventDefault()
  const r = stage.getBoundingClientRect()
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016))
}, { passive: false })

let dragging = false, sx = 0, sy = 0, stx = 0, sty = 0, moved = 0
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.side,.minimap,.hint')) return
  dragging = true; moved = 0; sx = e.clientX; sy = e.clientY; stx = cam.tx; sty = cam.ty
  stage.classList.add('dragging')
})
window.addEventListener('pointermove', e => {
  if (!dragging) return
  const dx = e.clientX - sx, dy = e.clientY - sy
  moved = Math.max(moved, Math.abs(dx) + Math.abs(dy))
  cam.tx = stx + dx; cam.ty = sty + dy
  schedule()
})
window.addEventListener('pointerup', () => { dragging = false; stage.classList.remove('dragging') })

document.addEventListener('click', e => {
  const head = e.target.closest('[data-zone-head]')
  if (head) { flyToZone(zones.find(z => z.d.id === head.dataset.zoneHead)); return }

  const cardEl2 = e.target.closest('[data-card]')
  if (cardEl2 && cardEl2.classList.contains('card')) {
    if (moved > 4) return
    const c = cardById.get(cardEl2.dataset.card)
    if (c) openCard(c)
    return
  }
  const relLink = e.target.closest('a[data-card]')
  if (relLink) {
    e.preventDefault()
    const c = cardById.get(relLink.dataset.card)
    if (c) { centerOn(c.x + c.w / 2, c.y + c.h / 2, Math.max(cam.k, 1.1)); openCard(c) }
    return
  }
  if (e.target.closest('#sideClose')) { closeCard(); return }

  const view = e.target.closest('[data-view]')
  if (view) {
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b === view)))
    document.getElementById('listview').classList.toggle('on', view.dataset.view === 'list')
    return
  }
  if (e.target.closest('[data-jump]')) { document.getElementById('q').value = ''; term = ''; fitOverview() }
})

document.getElementById('minimap').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect()
  centerOn((e.clientX - r.left) / r.width * WORLD_W, (e.clientY - r.top) / r.height * WORLD_H, Math.max(cam.k, 0.55))
})

document.addEventListener('keydown', e => {
  if (e.target.id === 'q') { if (e.key === 'Escape') { e.target.value = ''; runFilter(''); e.target.blur() } return }
  if (e.key === '/') { e.preventDefault(); document.getElementById('q').focus(); return }
  if (e.key === '0') { fitOverview(); return }
  if (e.key === 'Escape') {
    if (side.classList.contains('open')) return closeCard()
    const z = zoneAtCenter()
    if (cam.k > 1.0 && z) return flyToZone(z, 0.75)
    return fitOverview()
  }
})

/* ============================================================ 列表视图 / 启动 ============================================================ */
function renderList () {
  document.getElementById('listTable').innerHTML = `
    <thead><tr><th>域</th><th>标题</th><th>类型</th><th>平台</th><th>id</th></tr></thead>
    <tbody>${allCards.map(c => `<tr><td>${esc(c.zone.d.label)}</td><td>${esc(c.t)}</td>
      <td>${esc(c.ty || '未分类')}</td><td>${esc(c.p || '—')}</td>
      <td style="font-family:var(--mono);font-size:10.5px">${esc(c.id)}</td></tr>`).join('')}</tbody>`
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]))

renderZones()
renderList()
fitOverview()

/* demo 钩子：?demo=zone&d=linux · ?demo=card · ?demo=list */
const qs = new URLSearchParams(location.search)
const demo = qs.get('demo')
if (demo === 'zone') flyToZone(zones.find(z => z.d.id === (qs.get('d') || 'linux')))
if (demo === 'card') { const c = allCards[0]; centerOn(c.x + c.w / 2, c.y + c.h / 2, 1.3); openCard(c) }
if (demo === 'read') { const c = allCards.find(x => x.d === (qs.get('d') || 'nginx')) || allCards[0]; centerOn(c.x + c.w / 2, c.y + c.h / 2, Number(qs.get('k') || 1.35)); openCard(c) }
if (demo === 'find') { document.getElementById('q').value = qs.get('q') || 'nginx'; runFilter(document.getElementById('q').value) }
if (demo === 'list') document.querySelector('[data-view="list"]').click()
if (demo === 'fly') {
  const z = zones.find(x => x.d.id === (qs.get('d') || 'nginx')) || zones[0]
  const start = performance.now()
  const from = { k: cam.k, tx: cam.tx, ty: cam.ty }
  const to = { k: 1.35, tx: stage.clientWidth / 2 - (z.x + z.w / 2) * 1.35, ty: stage.clientHeight / 2 - (z.y + HEAD + z.grid.innerH / 2) * 1.35 }
  ;(function step (now) {
    const u = Math.min(1, (now - start) / 700)
    const e = 1 - Math.pow(1 - u, 3)
    cam.k = from.k + (to.k - from.k) * e
    cam.tx = from.tx + (to.tx - from.tx) * e
    cam.ty = from.ty + (to.ty - from.ty) * e
    applyCamera()
    if (u < 1) requestAnimationFrame(step)
  })(start)
}

window.addEventListener('resize', () => schedule())
</script>
</body>
</html>
