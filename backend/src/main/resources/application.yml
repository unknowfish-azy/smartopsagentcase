spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: smartops-backend

  profiles:
    active: dev

  # ==============================
  # 数据库迁移（Flyway）
  # 已有库的基线版本取当前最高迁移号：首次接入时把已存在的表视为已应用，
  # 不会重跑非幂等的 ALTER 脚本；全新库（空 schema）仍会从 V001 开始全部执行。
  # ==============================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 20261103

  # 优雅停机：滚动升级时给在途请求留出完成时间（PERF-08）。
  lifecycle:
    timeout-per-shutdown-phase: ${SMARTOPS_SHUTDOWN_TIMEOUT:20s}

server:
  port: 8080
  # 发布与滚动升级时先停止接新请求，再等在途请求结束（PERF-08）。
  shutdown: graceful
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SMARTOPS_SECURE_COOKIE:false}

# ==============================
# Actuator
# ==============================
management:
  endpoints:
    web:
      exposure:
        # prometheus 与 metrics 必须显式暴露，否则 Prometheus 抓取路径是断的（PERF-08）。
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        # 启用 /actuator/health/liveness 与 /actuator/health/readiness，
        # 让 K8s 探针区分"进程活着"与"可以接流量"。
        enabled: true
  metrics:
    tags:
      application: smartops-backend

# ==============================
# 日志
# ==============================
logging:
  level:
    root: INFO
    com.smartops: DEBUG

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartops.entity
  configuration:
    map-underscore-to-camel-case: true
smartops:
  knowledge:
    storage-root: ${SMARTOPS_KNOWLEDGE_STORAGE_ROOT:data/knowledge}
  mini:
    base-url: ${SMARTOPS_MINI_BASE_URL:http://127.0.0.1:11434}
    model: ${SMARTOPS_MINI_MODEL:qwen3:1.7b}
    knowledge-root: ${SMARTOPS_MINI_KNOWLEDGE_ROOT:../knowledge}
  bootstrap:
    username: ${SMARTOPS_BOOTSTRAP_USERNAME:admin}
    password: ${SMARTOPS_BOOTSTRAP_PASSWORD:}
  harbor:
    url: ${SMARTOPS_HARBOR_URL:}
    username: ${SMARTOPS_HARBOR_USERNAME:}
    secret: ${SMARTOPS_HARBOR_SECRET:}
  observability:
    prometheus-url: ${SMARTOPS_PROMETHEUS_URL:}
    prometheus-token: ${SMARTOPS_PROMETHEUS_TOKEN:}
    loki-url: ${SMARTOPS_LOKI_URL:}
    loki-token: ${SMARTOPS_LOKI_TOKEN:}
  diagnostics:
    targets: []
  operations:
    run:
      # 单次运维执行的绝对预算（整单，不是单条命令超时）
      deadline-ms: ${SMARTOPS_RUN_DEADLINE_MS:120000}
      # 单条命令落库的输出预算，超出截断并标记
      output-limit-bytes: ${SMARTOPS_RUN_OUTPUT_LIMIT_BYTES:524288}
      # 运行租约：超时无心跳则被恢复扫描判定为悬挂（UNCERTAIN，不自动重试）
      lease-ms: ${SMARTOPS_RUN_LEASE_MS:60000}
      recovery-stale-ms: ${SMARTOPS_RUN_RECOVERY_STALE_MS:90000}
      recovery-interval-ms: ${SMARTOPS_RUN_RECOVERY_INTERVAL_MS:60000}
      recovery-initial-delay-ms: ${SMARTOPS_RUN_RECOVERY_DELAY_MS:30000}
    # SSH 运行通道治理：按用户/会话配额、空闲 TTL 回收、命令输出上限
    ssh:
      max-per-user: ${SMARTOPS_SSH_MAX_PER_USER:20}
      max-per-session: ${SMARTOPS_SSH_MAX_PER_SESSION:4}
      idle-ttl-ms: ${SMARTOPS_SSH_IDLE_TTL_MS:900000}
      sweep-interval-ms: ${SMARTOPS_SSH_SWEEP_INTERVAL_MS:60000}
      sweep-initial-delay-ms: ${SMARTOPS_SSH_SWEEP_DELAY_MS:30000}
      output-limit-bytes: ${SMARTOPS_SSH_OUTPUT_LIMIT_BYTES:1048576}
    # 多机批量：并发上限与整单超时（复用 Runbook 目标子任务）
    multi-exec:
      max-parallel: ${SMARTOPS_MULTI_EXEC_MAX_PARALLEL:10}
      timeout-ms: ${SMARTOPS_MULTI_EXEC_TIMEOUT_MS:120000}
  cloud:
    sync:
      # 只读清单分页：单页条数与单次同步的页数上限，
      # 超过页数上限按 PARTIAL 处理并保留已取到的部分，不把未取到的资源判成消失。
      page-size: ${SMARTOPS_CLOUD_SYNC_PAGE_SIZE:50}
      max-pages: ${SMARTOPS_CLOUD_SYNC_MAX_PAGES:20}
      request-timeout-ms: ${SMARTOPS_CLOUD_HTTP_TIMEOUT_MS:15000}
      # 429 / 5xx 的重试次数与指数退避上限；权限不足不重试。
      max-attempts: ${SMARTOPS_CLOUD_HTTP_ATTEMPTS:3}
      backoff-base-ms: ${SMARTOPS_CLOUD_BACKOFF_BASE_MS:500}
      backoff-max-ms: ${SMARTOPS_CLOUD_BACKOFF_MAX_MS:4000}
    # CMDB 资源超过该秒数未刷新即展示为 STALE（只影响展示，不改写资源状态）
    stale-after-seconds: ${SMARTOPS_CLOUD_STALE_AFTER_SECONDS:3600}
  sentinel:
    poll:
      # 哨兵采集轮询：启动 20 秒后开始，每 30 秒检查一次到期任务
      initial-delay-ms: ${SMARTOPS_SENTINEL_POLL_DELAY_MS:20000}
      interval-ms: ${SMARTOPS_SENTINEL_POLL_INTERVAL_MS:30000}
      # 有界并发：慢目标最多占用这些槽位；额度用满后本轮停止认领（背压）
      max-concurrency: ${SMARTOPS_SENTINEL_MAX_CONCURRENCY:8}
      batch-size: ${SMARTOPS_SENTINEL_BATCH_SIZE:40}
      lease-ms: ${SMARTOPS_SENTINEL_LEASE_MS:90000}
      max-backoff-sec: ${SMARTOPS_SENTINEL_MAX_BACKOFF_SEC:3600}
    schedule:
      # 定时脚本默认**不开启**：到点只生成待审批预览，属"会自己发生"的行为，
      # 应由部署方显式打开（设置成较小的 initial-delay-ms）。
      initial-delay-ms: ${SMARTOPS_SENTINEL_SCHEDULE_DELAY_MS:9223372036854775807}
      interval-ms: ${SMARTOPS_SENTINEL_SCHEDULE_INTERVAL_MS:60000}
    guardian:
      # 守护 Agent：告警自动取证（只读）与指标基线学习（只出建议，不自动改阈值）
      collect:
        initial-delay-ms: ${SMARTOPS_SENTINEL_GUARDIAN_COLLECT_DELAY_MS:45000}
        interval-ms: ${SMARTOPS_SENTINEL_GUARDIAN_COLLECT_INTERVAL_MS:30000}
      learn:
        initial-delay-ms: ${SMARTOPS_SENTINEL_GUARDIAN_LEARN_DELAY_MS:120000}
        interval-ms: ${SMARTOPS_SENTINEL_GUARDIAN_LEARN_INTERVAL_MS:600000}
    notify:
      webhook:
        # 失败重试次数（4xx 不重试：对方明确拒绝，重试无意义）
        max-attempts: ${SMARTOPS_SENTINEL_WEBHOOK_ATTEMPTS:2}
        connect-timeout-ms: ${SMARTOPS_SENTINEL_WEBHOOK_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${SMARTOPS_SENTINEL_WEBHOOK_READ_TIMEOUT_MS:5000}
        # 默认拒绝内网地址（防 SSRF）。需要投递到内网网关时在此显式列出主机名。
        allow-hosts: ${SMARTOPS_SENTINEL_WEBHOOK_ALLOW_HOSTS:}
      email:
        # 未配置 host 与 from 时，邮件渠道如实报告 not_configured，不会假装已发送。
        host: ${SMARTOPS_SENTINEL_SMTP_HOST:}
        port: ${SMARTOPS_SENTINEL_SMTP_PORT:25}
        username: ${SMARTOPS_SENTINEL_SMTP_USERNAME:}
        password: ${SMARTOPS_SENTINEL_SMTP_PASSWORD:}
        from: ${SMARTOPS_SENTINEL_SMTP_FROM:}
        # 开启 STARTTLS 但保持证书校验，避免把凭据发给伪装服务器
        starttls: ${SMARTOPS_SENTINEL_SMTP_STARTTLS:false}
        timeout-ms: ${SMARTOPS_SENTINEL_SMTP_TIMEOUT_MS:8000}
  security:
    human-verification:
      enabled: ${SMARTOPS_HUMAN_VERIFICATION_ENABLED:true}
      site-key: ${SMARTOPS_TURNSTILE_SITE_KEY:}
      secret-key: ${SMARTOPS_TURNSTILE_SECRET_KEY:}
      hostnames: ${SMARTOPS_TURNSTILE_HOSTNAMES:}
      # 普通用户层登录是否每次都要验证。默认 true：两个入口行为一致，避免正常用户
      # 第一次遇到验证时对"突然出现的验证框"感到意外。设为 false 退回
      # "同一 IP/账号失败三次后才强制"的按风险策略。
      always-require-login: ${SMARTOPS_HUMAN_VERIFICATION_ALWAYS_REQUIRE_LOGIN:true}
    api-key-encryption-key: ${SMARTOPS_API_KEY_ENCRYPTION_KEY:}
    internal-token: ${SMARTOPS_INTERNAL_TOKEN:}
    internal-bypass: ${SMARTOPS_INTERNAL_BYPASS:false}
    chat:
      run-token:
        # SEC-01/SEC-02：Java 与会话绑定签发短时 HMAC 令牌，ai-service 校验后才处理聊天。
        # 留空时签发端点返回 503（fail-closed），不会退回匿名可用。
        # 必须与 ai-service 的 CHAT_RUN_TOKEN_SECRET 一致；至少 16 字节。
        secret: ${SMARTOPS_CHAT_RUN_TOKEN_SECRET:}
        ttl-seconds: ${SMARTOPS_CHAT_RUN_TOKEN_TTL_SECONDS:300}
