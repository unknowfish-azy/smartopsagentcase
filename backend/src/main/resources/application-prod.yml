spring:

  # ============================================
  # MySQL - 生产环境
  # ============================================
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/smartops?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # ============================================
    # HikariCP 连接池
    # ============================================
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SmartOpsHikariPool

  # ============================================
  # Redis
  # ============================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

      # Lettuce 连接池
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 0
          max-wait: -1ms

# ============================================
# Actuator
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

# ============================================
# Server
# ============================================
server:
  port: ${SERVER_PORT:8080}

# ============================================
# 日志
# ============================================
logging:
  level:
    root: INFO
    com.smartops: INFO
