spring:

  # ============================================
  # MySQL - 生产环境
  # ============================================
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/smartops?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    # SEC-13：生产不允许空密码/默认口令——启动断言（SecurityAssertions.verifyDeploymentSecrets）
    # 会校验 MYSQL_PASSWORD 非空且不等于已知默认值，不满足直接拒绝启动。
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # ============================================
    # HikariCP 连接池
    # ============================================
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SmartOpsHikariPool

  # ============================================
  # Redis
  # ============================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # SEC-13：生产 Redis 必须启用 requirepass，空密码会被启动断言拒绝。
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

      # Lettuce 连接池
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 0
          max-wait: -1ms

# ============================================
# Actuator
# ============================================
management:
  endpoints:
    web:
      exposure:
        # OPS-10/F12：Prometheus 通过 /actuator/prometheus 抓取 HTTP SLI（可用率/错误率/延迟）。
        # 该端点仅应由内网 Prometheus 访问，SecurityConfig 已单独放行且部署侧需限制来源。
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: smartops-backend

# ============================================
# Server
# ============================================
server:
  port: ${SERVER_PORT:8080}

# ============================================
# 日志
# ============================================
logging:
  level:
    root: INFO
    com.smartops: INFO
