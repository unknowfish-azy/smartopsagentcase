spring:

  # ============================================
  # MySQL
  # ============================================
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/smartops?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # ============================================
    # HikariCP 连接池
    # ============================================
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SmartOpsHikariPool

  # ============================================
  # Redis
  # ============================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

      # 本地Redis没有密码时保持为空
      password: ${REDIS_PASSWORD:}

      timeout: 3000ms

      # Lettuce 连接池
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# ============================================
# Actuator
# ============================================
management:
  endpoint:
    health:
      show-details: when-authorized

# ============================================
# 日志
# ============================================
logging:
  level:
    root: INFO
    com.smartops: DEBUG
    org.springframework.web: INFO

# ============================================
# SmartOps Security
# ============================================
# 本地开发专用 AES-GCM 加密密钥（32 字节 Base64）。
# 仅用于本地开发；生产环境必须通过环境变量
# SMARTOPS_API_KEY_ENCRYPTION_KEY 覆盖，不允许使用此默认值。
smartops:
  security:
    human-verification:
      # 本地开发默认关闭：前端算术题/图形点选答对后无法生成后端认可的 token。
      # 生产环境必须开启（默认 true），通过 SMARTOPS_HUMAN_VERIFICATION_ENABLED=true 覆盖。
      enabled: ${SMARTOPS_HUMAN_VERIFICATION_ENABLED:false}
      # 用户层登录也要求验证（与管理员层一致）。
      always-require-login: ${SMARTOPS_HUMAN_VERIFICATION_ALWAYS_REQUIRE_LOGIN:false}
    api-key-encryption-key: ${SMARTOPS_API_KEY_ENCRYPTION_KEY:U21hcnRPcHNBZ2VudERldktleSEyMDI2IURldk9ubHk=}
