spring:
  application:
    name: smartops-backend-test

  datasource:
    url: jdbc:h2:mem:smartops_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # 测试库是每次新建的 H2：基线设为 0，保证所有迁移脚本都会执行一遍，
  # 不受 spring.sql.init 与 Flyway 的先后顺序影响（schema.sql 只建最小集）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartops.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: WARN
    com.smartops: DEBUG

# 测试专用 AES-GCM 加密密钥（32 字节 Base64），仅供测试环境使用
smartops:
  attachments:
    cleanup-enabled: false
  security:
    human-verification:
      enabled: false
    api-key-encryption-key: U21hcnRPcHNBZ2VudFRlc3RLZXkhMjAyNiFhYmNkZWY=
    internal-token: test-internal-token
    internal-bypass: false
