# ============================================================
# SmartOpsAgent Nginx Configuration
#
# Frontend:
#   /              -> /opt/smartops/frontend
#
# Backend:
#   /api/          -> http://127.0.0.1:8080
#
# AI Service:
#   /ai-api/       -> http://127.0.0.1:8001/api/
#
# Health:
#   /health
# ============================================================


# ------------------------------------------------------------
# Worker Configuration
# ------------------------------------------------------------

worker_processes auto;


events {
    worker_connections 2048;
    multi_accept on;
}


# ------------------------------------------------------------
# HTTP Configuration
# ------------------------------------------------------------

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;


    # --------------------------------------------------------
    # Basic Performance
    # --------------------------------------------------------

    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;

    types_hash_max_size 2048;


    # --------------------------------------------------------
    # Upload Limit
    # --------------------------------------------------------

    client_max_body_size 50m;


    # --------------------------------------------------------
    # Logging
    # --------------------------------------------------------

    # SEC-11：access log 不记录 query string（$request 含完整 URL 可能带 api_key/token 等）。
    # 用 $uri（规范化路径，不含 query）替代 $request，仅记录方法 + 路径 + 协议。
    log_format smartops
        '$remote_addr - $remote_user '
        '[$time_local] '
        '"$request_method $uri $server_protocol" '
        '$status '
        '$body_bytes_sent '
        '"$http_referer" '
        '"$http_user_agent" '
        '"$http_x_forwarded_for"';


    access_log /var/log/nginx/smartops-access.log smartops;

    error_log /var/log/nginx/smartops-error.log warn;


    # --------------------------------------------------------
    # Upstream - Spring Boot Backend
    # --------------------------------------------------------

    upstream smartops_backend {

        server 127.0.0.1:8080;

        keepalive 32;
    }


    # --------------------------------------------------------
    # Upstream - FastAPI AI Service
    # --------------------------------------------------------

    upstream smartops_ai {

        server 127.0.0.1:8001;

        keepalive 16;
    }


    # --------------------------------------------------------
    # Main Server
    # --------------------------------------------------------

    server {

        listen 80;

        listen [::]:80;

        server_name _;


        # ----------------------------------------------------
        # Security / Basic Headers
        # ----------------------------------------------------

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "SAMEORIGIN" always;

        add_header Referrer-Policy "strict-origin-when-cross-origin" always;


        # ----------------------------------------------------
        # Frontend
        # ----------------------------------------------------

        location / {

            root /opt/smartops/frontend;

            index index.html;

            try_files $uri $uri/ /index.html;
        }


        # ----------------------------------------------------
        # Spring Boot Backend
        #
        # Browser:
        #   /api/servers
        #
        # Backend:
        #   http://127.0.0.1:8080/api/servers
        # ----------------------------------------------------

        location /api/ {

            proxy_pass http://smartops_backend;

            proxy_http_version 1.1;


            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_connect_timeout 30s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;


            proxy_buffering off;
        }


        # ----------------------------------------------------
        # AI Service
        #
        # Browser / Agent:
        #   /ai-api/chat
        #
        # FastAPI:
        #   /api/chat
        #
        # Example:
        #
        #   /ai-api/chat
        #       ↓
        #   http://127.0.0.1:8001/api/chat
        # ----------------------------------------------------

        # SEC-01（网络层隔离收口）：/ai-api 直连入口仅允许内网/回环来源
        # （公网访问一律 403）。公网浏览器的聊天流量走下方同源 /ai/ 前缀，
        # 由 ai-service 强制校验 Java 边缘签发的 X-Run-Token（无令牌 401）。
        location /ai-api/ {

            allow 127.0.0.1;
            allow ::1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://smartops_ai/api/;

            proxy_http_version 1.1;


            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_connect_timeout 30s;

            proxy_send_timeout 60s;

            proxy_read_timeout 120s;


            # AI Streaming / SSE 预留
            proxy_buffering off;

            proxy_cache off;


            # WebSocket 预留
            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";
        }


        # ----------------------------------------------------
        # AI Service（同源 /ai 前缀，浏览器默认入口）
        #
        # 前端 AI_SERVICE_BASE 默认 /ai，生产环境此前缺失该映射导致聊天 404。
        # 应用层已有 X-Run-Token 强制校验（SEC-01），此处不做来源限制。
        # ----------------------------------------------------

        location /ai/ {

            proxy_pass http://smartops_ai/api/;

            proxy_http_version 1.1;


            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_connect_timeout 30s;

            proxy_send_timeout 60s;

            proxy_read_timeout 120s;


            # AI Streaming / SSE
            proxy_buffering off;

            proxy_cache off;
        }


        # ----------------------------------------------------
        # Health Check
        # ----------------------------------------------------

        location = /health {

            access_log off;

            default_type text/plain;

            return 200 "smartops-nginx-ok\n";
        }


        # ----------------------------------------------------
        # Robots
        # ----------------------------------------------------

        location = /robots.txt {

            access_log off;

            log_not_found off;
        }


        # ----------------------------------------------------
        # Favicon
        # ----------------------------------------------------

        location = /favicon.ico {

            access_log off;

            log_not_found off;
        }


        # ----------------------------------------------------
        # Static Asset Cache
        # ----------------------------------------------------

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {

            root /opt/smartops/frontend;

            expires 7d;

            add_header Cache-Control "public, max-age=604800";

            try_files $uri =404;
        }


        # ----------------------------------------------------
        # Prevent Access to Sensitive Files
        # ----------------------------------------------------

        location ~ /\. {

            deny all;

            access_log off;

            log_not_found off;
        }


        location ~* \.(env|log|bak|sql|key|pem)$ {

            deny all;

            access_log off;

            log_not_found off;
        }
    }
}