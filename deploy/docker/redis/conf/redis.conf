# ============================================================
# SmartOpsAgent Redis Configuration
# ============================================================

# ------------------------------------------------------------
# 网络
# ------------------------------------------------------------
# SEC-13：容器内监听全部接口以服务 docker 网络；端口不发布到宿主机
# （见 docker-compose.yml），认证由 --requirepass（REDIS_PASSWORD）强制，
# 因此这里不再是无口令裸奔的 0.0.0.0。

bind 0.0.0.0

port 6379

protected-mode yes


# ------------------------------------------------------------
# 客户端连接
# ------------------------------------------------------------

tcp-keepalive 300

timeout 0

tcp-backlog 511

maxclients 10000


# ------------------------------------------------------------
# 数据库
# ------------------------------------------------------------

databases 16


# ------------------------------------------------------------
# 持久化
# ------------------------------------------------------------

# RDB 快照
save 900 1
save 300 10
save 60 10000


# AOF 持久化
appendonly yes

appendfilename "appendonly.aof"

appendfsync everysec

aof-use-rdb-preamble yes


# ------------------------------------------------------------
# 内存策略
# ------------------------------------------------------------

maxmemory-policy allkeys-lru


# ------------------------------------------------------------
# 日志
# ------------------------------------------------------------

loglevel notice


# ------------------------------------------------------------
# 编码与其他基础配置
# ------------------------------------------------------------

hz 10

dynamic-hz yes

latency-monitor-threshold 100


# ------------------------------------------------------------
# 目录
# ------------------------------------------------------------

dir /data