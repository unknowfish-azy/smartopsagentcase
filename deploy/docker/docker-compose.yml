# ============================================================
# SmartOpsAgent Development Infrastructure
#
# 当前负责：
#   MySQL
#   Redis
#
# Backend / AI Service / Frontend
# 当前保持独立运行：
#   Backend    -> 8080
#   AI Service -> 8001
#   Frontend   -> Nginx :80
#
# 启动：
#   docker compose up -d
#
# 查看：
#   docker compose ps
#
# 停止：
#   docker compose down
#
# 查看日志：
#   docker compose logs -f
# ============================================================


services:

  # ==========================================================
  # MySQL
  # ==========================================================

  mysql:

    image: mysql:8.4

    container_name: smartops-mysql

    restart: unless-stopped

    environment:

      # SEC-13：不再提供 change-me 默认口令；未通过环境变量注入时 compose 直接拒绝启动。
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required (SEC-13: no default credentials)}"

      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartops}

      MYSQL_USER: ${MYSQL_USER:-smartops}

      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required (SEC-13: no default credentials)}"

      TZ: Asia/Shanghai


    # SEC-13：3306 不发布到宿主机，仅容器网络内可达；
    # 本机调试需要直连时用 `docker exec -it smartops-mysql mysql -u...` 或临时放开注释。
    # ports:
    #
    #   - "${MYSQL_PORT:-3306}:3306"


    volumes:

      - mysql_data:/var/lib/mysql

      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/smartops.cnf:ro

      - ./mysql/init:/docker-entrypoint-initdb.d:ro


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 30s


    networks:

      - smartops-network


  # ==========================================================
  # Redis
  # ==========================================================

  redis:

    image: redis:7.4

    container_name: smartops-redis

    restart: unless-stopped


    # SEC-13：Redis 必须启用 requirepass（密码经 REDIS_PASSWORD 注入，无默认值）。
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required (SEC-13: redis must have requirepass)}"
      ]

    environment:

      REDIS_PASSWORD: ${REDIS_PASSWORD}


    # SEC-13：6379 不发布到宿主机，仅容器网络内可达；
    # 本机调试需要直连时用 `docker exec -it smartops-redis redis-cli`。
    # ports:
    #
    #   - "${REDIS_PORT:-6379}:6379"


    volumes:

      - redis_data:/data

      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 10s


    networks:

      - smartops-network


  # ==========================================================
  # Backend（PERF-08：可运行发布入口）
  # ==========================================================
  # 说明：此前 compose 只起 MySQL/Redis，后端与 AI 服务"独立运行"，
  # 导致发布链路在 compose 这一层是断的。这里补上真实可 `up` 的服务定义。

  backend:

    build:

      context: ../../backend

      dockerfile: Dockerfile

    image: smartops-backend:local

    container_name: smartops-backend

    restart: unless-stopped

    depends_on:

      mysql:

        condition: service_healthy

      redis:

        condition: service_healthy

    environment:

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      MYSQL_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smartops}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"

      MYSQL_USERNAME: ${MYSQL_USER:-smartops}

      # SEC-13：与 mysql 服务同源，禁止回落到示例口令。
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required (SEC-13: no default credentials)}"

      REDIS_HOST: redis

      REDIS_PORT: 6379

      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required (SEC-13: redis must have requirepass)}"

      # SEC-13：生产启动断言要求以下值由外部注入，compose 不提供默认。
      SMARTOPS_API_KEY_ENCRYPTION_KEY: "${SMARTOPS_API_KEY_ENCRYPTION_KEY:?SMARTOPS_API_KEY_ENCRYPTION_KEY is required}"

      SMARTOPS_INTERNAL_TOKEN: "${SMARTOPS_INTERNAL_TOKEN:?SMARTOPS_INTERNAL_TOKEN is required}"

      SMARTOPS_CHAT_RUN_TOKEN_SECRET: "${SMARTOPS_CHAT_RUN_TOKEN_SECRET:?SMARTOPS_CHAT_RUN_TOKEN_SECRET is required}"

      TZ: Asia/Shanghai

    ports:

      - "${BACKEND_PORT:-8080}:8080"

    # 优雅停机：server.shutdown=graceful 需要编排侧给出足够的终止宽限期
    stop_grace_period: 40s

    healthcheck:

      test:

        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"
        ]

      interval: 15s

      timeout: 5s

      retries: 10

      start_period: 60s

    networks:

      - smartops-network


  # ==========================================================
  # AI Service
  # ==========================================================

  ai-service:

    build:

      context: ../../ai-service

      dockerfile: Dockerfile

    image: smartops-ai-service:local

    container_name: smartops-ai-service

    restart: unless-stopped

    environment:

      TZ: Asia/Shanghai

    ports:

      - "${AI_SERVICE_PORT:-8001}:8001"

    # 健康检查由镜像内 HEALTHCHECK 提供（slim 镜像不含 curl）
    networks:

      - smartops-network


# ============================================================
# Persistent Volumes
# ============================================================

volumes:

  mysql_data:

    name: smartops-mysql-data


  redis_data:

    name: smartops-redis-data


# ============================================================
# Internal Network
# ============================================================

networks:

  smartops-network:

    name: smartops-network

    driver: bridge