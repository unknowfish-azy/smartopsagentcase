<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <link rel="stylesheet" href="ball.css" />
  <title>智维伴侣</title>
</head>
<body>
  <div id="ball" class="ball ball--idle" role="button" aria-label="智维伴侣悬浮球：单击对话，双击截屏提问，长按3秒菜单" tabindex="-1">
    <div class="ball__core">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <!-- 小鲸鱼轮廓：头 + 尾 -->
        <path class="ball__whale" d="M8 28c0-9 7.5-15 17-15 8 0 14 4.5 15 11 .6 4-1.5 7-4 7H13c-3 0-5-1.5-5-3z"/>
        <circle class="ball__eye" cx="33" cy="25" r="1.8"/>
        <path class="ball__tail" d="M40 22c3-1 5-3.5 5-6 0 3.5-1 6-2.5 7.5L40 22z"/>
        <path class="ball__spout" d="M22 13c0-3 1.5-4.5 3.5-5-1 2-1 3.5-1 5z"/>
      </svg>
    </div>
    <div class="ball__ring"></div>
    <div class="ball__halo"></div>
  </div>
  <script src="ball.js"></script>
</body>
</html>
